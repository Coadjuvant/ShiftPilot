#version: "3.9"

networks:
  shiftpilot:
    driver: bridge

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-shiftpilot_db}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - shiftpilot

  backend:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      # Ensure these are present in .env on the server.
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASS=${ADMIN_PASS}
      - ADMIN_LICENSE=${ADMIN_LICENSE}
      - AUTH_BACKEND=${AUTH_BACKEND}
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080,http://127.0.0.1:5173}
      - GEOIP_API_URL=${GEOIP_API_URL:-}
      - GEOIP_API_TIMEOUT=${GEOIP_API_TIMEOUT:-2.0}
      - GEOIP_CACHE_TTL=${GEOIP_CACHE_TTL:-3600}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shiftpilot
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # Pass through the API URL (include /api) from your .env
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_BUILD: ${VITE_APP_BUILD}
        VITE_APP_VERSION: ${VITE_APP_VERSION}
        VITE_GIT_COMMIT: ${VITE_GIT_COMMIT}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shiftpilot
    expose:
      - "80"
    ports:
      - "127.0.0.1:8080:80"

volumes:
  db-data:
