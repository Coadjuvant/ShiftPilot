name: Application checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: shiftpilot_test
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: shiftpilot_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U shiftpilot_test" --health-interval 5s --health-retries 12
    env:
      SHIFT_TEST_DATABASE_URL: postgresql://shiftpilot_test:ci-test-only-password@127.0.0.1:5432/shiftpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: bash -n auto-deploy.sh
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=high
